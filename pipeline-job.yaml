# Runs the generator from shared storage using the in-cluster LiteLLM API.
# The hostPath must be changed to the path visible on the Kubernetes node(s).
apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-run
  namespace: llm-logging
  labels:
    app: python-pipeline
    pipeline: synthetic-games
spec:
  completionMode: Indexed
  completions: 11
  parallelism: 2
  ttlSecondsAfterFinished: 86400
  backoffLimit: 11
  template:
    metadata:
      labels:
        app: python-pipeline
        pipeline: synthetic-games
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      # Optional: pin to the node(s) that have the shared disk.
      # nodeSelector:
      #   kubernetes.io/hostname: soketlab-worker003
      containers:
        - name: pipeline
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          workingDir: /pipeline
          env:
            # LLM provider, endpoint, API key, model, and timeout are loaded
            # from /pipeline/.env by the generator after it finds the repo.
            - name: PIPELINE_SAMPLES
              value: "1000"
            - name: PIPELINE_CONVERSATION_TYPE
              value: both
            - name: PIPELINE_MAX_TURNS
              value: "6"
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          command:
            - /bin/sh
            - -ec
          args:
            - |
              case "${JOB_COMPLETION_INDEX}" in
                0) DOMAIN=chess ;;
                1) DOMAIN=sudoku ;;
                2) DOMAIN=kenken ;;
                3) DOMAIN=kakuro ;;
                4) DOMAIN=starbattle ;;
                5) DOMAIN=nonogram ;;
                6) DOMAIN=hitori ;;
                7) DOMAIN=nurikabe ;;
                8) DOMAIN=othello ;;
                9) DOMAIN=minesweeper ;;
                10) DOMAIN=wordle ;;
                *) echo "Unsupported completion index: ${JOB_COMPLETION_INDEX}" >&2; exit 1 ;;
              esac

              cd /pipeline
              # The shared mount may contain the repository at its root or in
              # one existing subdirectory; do not create any directories.
              if [ ! -f src/generator/cli.py ]; then
                for candidate in /pipeline/*; do
                  if [ -f "${candidate}/src/generator/cli.py" ]; then
                    cd "${candidate}"
                    break
                  fi
                done
              fi
              if [ ! -f src/generator/cli.py ]; then
                echo "Could not find src/generator/cli.py under /home/aman/Synthetic-Games-Data-Generation" >&2
                exit 1
              fi
              if [ ! -f .env ]; then
                echo "Missing .env in the generator repository; refusing to use fallback LLM settings" >&2
                exit 1
              fi
              if [ -f requirements.txt ]; then
                pip install --quiet -r requirements.txt
              fi

              exec python -m src.generator.cli run \
                --domain "${DOMAIN}" \
                --samples "${PIPELINE_SAMPLES}" \
                --conversation-type "${PIPELINE_CONVERSATION_TYPE}" \
                --max-turns "${PIPELINE_MAX_TURNS}" \
                --job-name "pipeline-${DOMAIN}-s1000"
          volumeMounts:
            - name: pipeline-code
              mountPath: /pipeline
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: pipeline-code
          hostPath:
            # Existing repository checkout on the Kubernetes node.
            path: /home/aman/Synthetic-Games-Data-Generation
            type: Directory
