[project]
name = "synthetic-sudoku-dataset"
version = "0.1.0"
description = "Synthetic tool-usage conversation data generation system for Chess and logic-puzzle domains"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
  "requests>=2.31.0",
  "pydantic>=2.0.0",
  "python-chess>=1.999",
]

[project.scripts]
sudoku-generator = "src.generator.cli:main"
puzzle-generator = "src.generator.cli:main"
chess-backend-setup = "src.generator.chess_setup:main"

[tool.pytest.ini_options]
pythonpath = ["."]
