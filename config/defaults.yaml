defaults:
  samples: 10
  domain: sudoku
  conversation_type: both
  max_turns: 6
  output_dir: outputs
  job_name: null
  generation:
    random_seed: 17
    max_regeneration_attempts: 12
    max_prompt_characters: 50000
  model:
    provider: openai
    model_name: gpt-4o-mini
    temperature: 0.8
    max_tokens: 800
    timeout: 60
  storage:
    metadata_filename: samples.jsonl
    rejected_filename: rejected_samples.jsonl
    stats_filename: dataset_stats.json
    events_filename: generation_events.jsonl
    log_filename: generation.log
  puzzles:
    persistent_bank_filename: puzzle_bank.jsonl
    usage_stats_filename: puzzle_usage.json
    variant_scan_limit: 256
    allow_balanced_reuse: true
    min_tools_per_sample: 2
    min_tool_catalog_size: 10
  similarity:
    max_history: 5000
    ngram_size: 3
    exact_duplicate_threshold: 1.0
    normalized_duplicate_threshold: 1.0
    ngram_overlap_threshold: 0.92
    embedding_similarity_threshold: 0.96
    structural_similarity_threshold: 0.97
    scenario_similarity_threshold: 0.95
    puzzle_similarity_threshold: 1.0
    related_puzzle_similarity: 0.35
    related_edge_case_puzzle_similarity: 0.55
    contextual_similarity_text_floor: 0.75
  scenario:
    task_categories:
      - next_best_move
      - validity_check
      - rules_explanation
      - solve_puzzle
      - solve_row_column_box
      - hint
      - mistake_correction
      - technique_discussion
      - beginner_question
      - advanced_question
      - general_chat
    difficulty_levels:
      - easy
      - medium
      - hard
      - expert
    user_expertise_levels:
      - beginner
      - intermediate
      - advanced
      - expert
    user_personalities:
      - careful
      - impatient
      - curious
      - skeptical
      - analytical
    assistant_styles:
      - concise
      - coaching
      - explanatory
      - Socratic
      - supportive
    tones:
      - neutral
      - friendly
      - urgent
      - frustrated
      - academic
    edge_cases:
      - none
      - incorrect_assumption
      - invalid_board
      - ambiguous_board
      - unsolvable_board
      - malformed_input
    tool_usage_modes:
      - none
      - candidate_scan
      - row_column_box_check
      - solution_verification
  domains:
    chess:
      puzzles:
        persistent_bank_filename: chess_position_bank_v2.jsonl
        usage_stats_filename: chess_position_usage_v2.json
        catalog_version: chess-v2
        lineage_count: 256
        snapshots_per_lineage: 4
        edge_case_rate: 0.15
        min_tools_per_sample: 2
      chess:
        engine_path: auto
        engine_auto_install: true
        engine_cache_dir: null
        engine_release_api: https://api.github.com/repos/official-stockfish/Stockfish/releases/latest
        engine_depth: 12
        tablebase_path: auto
        tablebase_online: true
        tablebase_url: https://tablebase.lichess.ovh/standard
        tablebase_retries: 3
        verification_backends_required: true
        tool_timeout: 60
      scenario:
        task_categories:
          - rules_explanation
          - notation_conversion
          - legal_move_check
          - board_interpretation
          - opening_guidance
          - explain_previous_move
          - tactical_puzzle
          - positional_analysis
          - endgame_analysis
          - special_move
          - draw_rules
          - terminal_state
          - best_move
          - move_comparison
          - mistake_diagnosis
          - continuation_speculation
          - hint
          - guided_solving
          - teaching
          - opponent_response_prediction
          - post_game_review
          - general_chat
        difficulty_levels: [easy, medium, hard, expert]
        user_expertise_levels: [beginner, intermediate, advanced, expert]
        user_personalities: [careful, impatient, curious, skeptical, analytical]
        assistant_styles: [concise, coaching, explanatory, Socratic, supportive]
        tones: [neutral, friendly, urgent, frustrated, academic]
        edge_cases: [none, malformed_input, illegal_move, ambiguous_input, contradictory_input, invalid_position, incomplete_input]
        tool_usage_modes: [none, parse_validate, reconstruct, legal_moves, move_application, position_status, tactical_inspection, engine_analysis, tablebase_lookup]
