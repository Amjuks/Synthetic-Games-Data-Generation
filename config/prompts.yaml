system_prompt: |
  You are a helpful Sudoku assistant. Generate natural, realistic conversations about Sudoku puzzles, strategies, hints, and gameplay.
  Always follow the supplied scenario and puzzle metadata exactly.
  Never invent or alter Sudoku boards unless the scenario explicitly requires malformed input.

single_turn_prompt: |
  Create a single-turn Sudoku exchange. The prompt and response should feel natural and realistic.
  Include one of these themes: asking for the next move, checking if a move is valid, explaining rules, solving a puzzle, giving hints, or answering a general Sudoku question.
  Keep the exchange concise but useful.
  When a Sudoku board is supplied, make the prompt and response clearly reference that exact board.
  Respect scenario constraints such as expertise, tone, assistant style, edge case behavior, and tool usage.

multi_turn_prompt: |
  Create a multi-step Sudoku conversation with 2 to {max_turns} exchanges.
  Each exchange should be represented as one object with a user message and the corresponding response.
  The conversation should flow naturally and include realistic progression such as a hint, clarification, correction, or deeper explanation.
  When a Sudoku board is supplied, make the exchanges clearly reference that exact board.
  Respect scenario constraints such as expertise, tone, assistant style, edge case behavior, and tool usage.

conversation_categories:
  - next_best_move
  - validity_check
  - rules_explanation
  - solve_puzzle
  - solve_row_column_box
  - hint
  - mistake_correction
  - technique_discussion
  - beginner_question
  - advanced_question
  - general_chat

domains:
  kenken:
    system_prompt: |
      You are a helpful KenKen assistant. Generate natural, realistic conversations about KenKen cages, Latin-square constraints, arithmetic strategies, hints, and gameplay.
      Always follow the supplied scenario, cage layout, and ground-truth metadata exactly.
      Never invent or alter the puzzle representation unless the scenario explicitly requires malformed input.
    single_turn_prompt: |
      Create a concise single-turn KenKen exchange grounded in the supplied grid and cage clues.
      Respect the requested expertise, tone, assistant style, edge case, and tool usage.
    multi_turn_prompt: |
      Create a natural KenKen conversation with 2 to {max_turns} exchanges.
      Each exchange must be an object with a user message and its corresponding response.
      Progress through cage arithmetic, row/column constraints, hints, corrections, or deeper strategy as required by the scenario.
    conversation_categories:
      - next_best_move
      - validity_check
      - rules_explanation
      - solve_puzzle
      - cage_analysis
      - hint
      - mistake_correction
      - technique_discussion
      - beginner_question
      - advanced_question
      - general_chat
  kakuro:
    system_prompt: |
      You are a helpful Kakuro (Cross Sums) assistant. Generate natural conversations about across/down sums, distinct-digit combinations, crossing-run deductions, hints, and gameplay.
      Follow the supplied grid, clues, scenario, and ground truth exactly.
      Never invent or alter the puzzle representation unless malformed input is explicitly required.
    single_turn_prompt: |
      Create a concise single-turn Kakuro exchange grounded in the supplied crossword grid and across/down clues.
      Respect the requested expertise, tone, assistant style, edge case, and tool usage.
    multi_turn_prompt: |
      Create a natural Kakuro conversation with 2 to {max_turns} exchanges.
      Each exchange must contain a user message and its corresponding response.
      Progress through run combinations, crossing constraints, hints, corrections, or deeper strategy as required.
    conversation_categories:
      - next_best_move
      - validity_check
      - rules_explanation
      - solve_puzzle
      - run_analysis
      - hint
      - mistake_correction
      - technique_discussion
      - beginner_question
      - advanced_question
      - general_chat
